<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>映像化フェア管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;background:#f5f6f8;color:#222}
button,input{font:inherit}
header{background:#1f2937;color:white;padding:18px 18px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:21px;margin:0 0 4px}
header p{margin:0;font-size:12px;opacity:.8}
nav{display:flex;overflow-x:auto;background:white;border-bottom:1px solid #ddd;position:sticky;top:74px;z-index:4}
nav button{border:0;background:white;padding:13px 16px;white-space:nowrap;font-weight:700;color:#666}
nav button.active{color:#1f2937;border-bottom:3px solid #1f2937}
main{max-width:760px;margin:auto;padding:16px}
section{display:none}
section.active{display:block}
.card{background:white;border-radius:14px;padding:17px;margin-bottom:14px;box-shadow:0 1px 4px #0000000d}
h2{font-size:18px;margin:0 0 14px}
h3{font-size:16px;margin:0 0 8px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}
input{width:100%;padding:12px;border:1px solid #ccd1d8;border-radius:10px;background:white}
.primary,.secondary,.danger{border:0;border-radius:11px;padding:12px 15px;font-weight:700;cursor:pointer}
.primary{background:#1f2937;color:white;width:100%;margin-top:12px}
.secondary{background:#eef0f3;color:#222}
.danger{background:#fff0f0;color:#b42318}
.bigbtn{font-size:17px;padding:17px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.muted{color:#777;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:white;border-radius:14px;padding:16px}
.stat b{display:block;font-size:25px;margin-top:5px}
.book{border:1px solid #e1e4e8;border-radius:12px;padding:14px;margin-top:10px}
.book-title{font-weight:800}
.badge{display:inline-block;background:#eef0f3;border-radius:999px;padding:4px 8px;font-size:11px;margin-top:7px}
.sales{margin-top:10px;border-top:1px solid #eee;padding-top:10px}
.empty{text-align:center;padding:35px 10px;color:#888}
video{width:100%;border-radius:12px;background:#111;display:none}
#scanStatus{margin-top:8px;font-size:12px;color:#666}
.custom-page{white-space:pre-wrap;line-height:1.7}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:18px;align-items:flex-end}
.modal.show{display:flex}
.modal-box{background:white;border-radius:18px 18px 0 0;padding:20px;width:100%;max-height:85vh;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>🎬 映像化フェア管理</h1>
  <p>ISBNで商品を登録して、販売実績を記録</p>
</header>

<nav id="nav">
  <button class="active" data-page="home">ホーム</button>
  <button data-page="register">📷 商品登録</button>
  <button data-page="books">📚 商品一覧</button>
  <button data-page="sales">📊 実績確認</button>
  <button data-page="manage">⚙️ ページ管理</button>
</nav>

<main>
<section id="home" class="active">
  <div class="stats">
    <div class="stat">登録商品<b id="statBooks">0</b><span class="muted">冊</span></div>
    <div class="stat">累計販売<b id="statSales">0</b><span class="muted">冊</span></div>
  </div>
  <div class="card" style="margin-top:14px">
    <h2>今日の操作</h2>
    <button class="primary bigbtn" onclick="go('register')">📷 ISBNから商品を追加</button>
    <button class="primary" onclick="go('sales')">📊 販売実績を入力・確認</button>
  </div>
  <div id="customPages"></div>
</section>

<section id="register">
  <div class="card">
    <h2>📷 商品を追加</h2>
    <button class="primary bigbtn" id="startScan">カメラでISBNを読み取る</button>
    <video id="video" playsinline></video>
    <div id="scanStatus"></div>
    <label>ISBN</label>
    <input id="isbn" inputmode="numeric" placeholder="978...">
    <button class="secondary" style="margin-top:8px;width:100%" onclick="lookupBook()">ISBNから書籍情報を取得</button>
    <div id="bookPreview"></div>
  </div>
</section>

<section id="books">
  <div class="card">
    <h2>📚 商品一覧</h2>
    <div id="bookList"></div>
  </div>
</section>

<section id="sales">
  <div class="card">
    <h2>📊 販売実績</h2>
    <p class="muted">入力した日が自動で記録されます。毎週入力しなくても大丈夫。</p>
    <div id="salesList"></div>
  </div>
</section>

<section id="manage">
  <div class="card">
    <h2>⚙️ ページ管理</h2>
    <p class="muted">ここから、このWebアプリ内のページを追加・削除できる設計にしています。</p>
    <button class="primary" onclick="openModal()">＋ ページを追加</button>
    <div id="manageList" style="margin-top:12px"></div>
    <p class="muted" style="margin-top:14px">※現在は試作段階なので、ページ設定はこの端末に保存されます。共有化すると全員に反映されるようにします。</p>
  </div>
</section>
</main>

<div class="modal" id="modal">
 <div class="modal-box">
  <h2>新しいページを追加</h2>
  <label>ページ名</label>
  <input id="newPageName" placeholder="例：ランキング">
  <label>説明</label>
  <input id="newPageDesc" placeholder="例：売上ランキングを確認">
  <div class="row" style="margin-top:14px">
   <button class="secondary" onclick="closeModal()">キャンセル</button>
   <button class="primary" style="margin-top:0" onclick="addPage()">追加</button>
  </div>
 </div>
</div>

<script>
const KEY='eizouFairPrototype';
let data=JSON.parse(localStorage.getItem(KEY)||'{"books":[],"pages":[]}');
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();}
function go(page){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===page));
 render();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));

async function lookupBook(){
 let isbn=$('isbn').value.replace(/[^0-9Xx]/g,'');
 if(isbn.length===10){isbn=isbn==='?'?isbn:('978'+isbn.slice(0,9));}
 if(isbn.length!==13){alert('ISBN-13を入力してください');return}
 $('bookPreview').innerHTML='<p class="muted">書籍情報を検索中…</p>';
 try{
   const r=await fetch('https://api.openbd.jp/v1/get?isbn='+isbn);
   const j=await r.json();
   const s=j&&j[0]&&j[0].summary;
   if(!s) throw new Error();
   $('bookPreview').innerHTML=
    '<div class="book"><div class="book-title">'+esc(s.title||'タイトル不明')+'</div>'+
    '<div class="muted">'+esc(s.author||'著者不明')+'</div>'+
    '<span class="badge">ISBN '+isbn+'</span>'+
    '<button class="primary" onclick="addBook(\''+isbn+'\',\''+escAttr(s.title||'タイトル不明')+'\')">この本を登録</button></div>';
 }catch(e){
   $('bookPreview').innerHTML='<p class="muted">書籍情報を取得できませんでした。ISBNを確認して、下の登録を試してください。</p>'+
   '<button class="primary" onclick="addBook(\''+isbn+'\',\'タイトル未取得\')">ISBN '+isbn+' を登録</button>';
 }
}
function addBook(isbn,title){
 if(data.books.some(b=>b.isbn===isbn)){alert('このISBNはすでに登録されています');return}
 data.books.push({id:Date.now(),isbn,title,registeredAt:new Date().toISOString(),sales:[]});
 save(); $('isbn').value=''; $('bookPreview').innerHTML='';
 alert('商品を登録しました！');
 go('books');
}
function addSale(id){
 const n=prompt('今回の販売実績を入力してください（冊）','');
 if(n===null)return;
 const qty=Number(n);
 if(!Number.isInteger(qty)||qty<0){alert('0以上の整数で入力してください');return}
 const b=data.books.find(x=>x.id===id); if(!b)return;
 b.sales.push({date:new Date().toISOString(),qty});
 save();
}
function total(b){return b.sales.reduce((a,x)=>a+x.qty,0)}
function render(){
 $('statBooks').textContent=data.books.length;
 $('statSales').textContent=data.books.reduce((a,b)=>a+total(b),0);
 $('bookList').innerHTML=data.books.length?data.books.map(b=>`
  <div class="book">
   <div class="book-title">${esc(b.title)}</div>
   <div class="muted">ISBN ${esc(b.isbn)} ／ 登録日 ${date(b.registeredAt)}</div>
   <div class="row" style="margin-top:10px">
    <button class="primary" style="margin:0" onclick="addSale(${b.id})">＋ 販売実績を入力</button>
    <button class="secondary" onclick="showHistory(${b.id})">履歴</button>
   </div>
   <div class="sales"><b>累計 ${total(b)}冊</b></div>
  </div>`).join(''):'<div class="empty">まだ商品が登録されていません</div>';
 $('salesList').innerHTML=data.books.length?data.books.map(b=>`
  <div class="book">
   <div class="book-title">${esc(b.title)}</div>
   <div class="muted">登録日 ${date(b.registeredAt)}</div>
   <div style="font-size:24px;font-weight:800;margin:7px 0">${total(b)}冊</div>
   <button class="primary" style="margin:0" onclick="addSale(${b.id})">＋ 今回の実績を入力</button>
   ${b.sales.length?'<div class="sales">'+b.sales.slice().reverse().map(s=>`<div>${dateTime(s.date)}　<b>${s.qty}冊</b></div>`).join('')+'</div>':''}
  </div>`).join(''):'<div class="empty">まだ商品が登録されていません</div>';
 $('customPages').innerHTML=data.pages.map(p=>`<div class="card"><h2>${esc(p.name)}</h2><p class="custom-page">${esc(p.desc||'')}</p></div>`).join('');
 $('manageList').innerHTML=data.pages.length?data.pages.map(p=>`
  <div class="book"><b>${esc(p.name)}</b><div class="muted">${esc(p.desc||'')}</div>
  <button class="danger" style="margin-top:9px" onclick="deletePage(${p.id})">削除</button></div>`).join(''):'<div class="empty">追加したページはここに表示されます</div>';
}
function showHistory(id){go('sales');setTimeout(()=>{const el=[...document.querySelectorAll('.book')].find(x=>x.textContent.includes((data.books.find(b=>b.id===id)||{}).title)); if(el)el.scrollIntoView({behavior:'smooth'});},50)}
function openModal(){$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function addPage(){
 const name=$('newPageName').value.trim(); const desc=$('newPageDesc').value.trim();
 if(!name){alert('ページ名を入力してください');return}
 data.pages.push({id:Date.now(),name,desc});save();$('newPageName').value='';$('newPageDesc').value='';closeModal();
}
function deletePage(id){if(confirm('このページを削除しますか？')){data.pages=data.pages.filter(p=>p.id!==id);save()}}
function date(v){return new Date(v).toLocaleDateString('ja-JP')}
function dateTime(v){return new Date(v).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escAttr(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}
render();

let stream=null;
$('startScan').onclick=async()=>{
 if(!navigator.mediaDevices){alert('この端末ではカメラを利用できません');return}
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
  $('video').srcObject=stream;$('video').style.display='block';await $('video').play();
  $('scanStatus').textContent='カメラを起動しました。ISBNバーコードを映してください。';
  if('BarcodeDetector' in window){
   const detector=new BarcodeDetector({formats:['ean_13','ean_8']});
   const scan=async()=>{
    if(!stream)return;
    try{
     const codes=await detector.detect($('video'));
     if(codes.length){
      $('isbn').value=codes[0].rawValue;
      $('scanStatus').textContent='ISBNを読み取りました。書籍情報を取得します。';
      stopScan(); lookupBook(); return;
     }
    }catch(e){}
    requestAnimationFrame(scan);
   }; scan();
  }else $('scanStatus').textContent='このブラウザでは自動読み取りに対応していません。ISBNを入力してください。';
 }catch(e){alert('カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。')}
};
function stopScan(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').style.display='none'}
</script>
</body>
</html>
